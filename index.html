<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Platform</title>
  </head>
  <body>
    <main id="app">
      <section class="viewport-shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Graphics Algorithm Lab</p>
            <h1>Games Platform</h1>
          </div>
          <div class="topbar-actions">
            <label class="lab-picker">
              <span>Lab</span>
              <select id="lab-select" disabled></select>
            </label>
            <div class="status-pill" id="gpu-status">Initializing WebGPU</div>
          </div>
        </header>
        <div class="workspace">
          <canvas id="gfx-canvas" aria-label="WebGPU viewport"></canvas>
          <div
            class="panel-resizer"
            id="panel-resizer"
            role="separator"
            aria-label="Resize parameter panel"
            aria-orientation="vertical"
            tabindex="0"
          ></div>
          <aside class="side-panel">
            <p class="panel-label">Active Lab</p>
            <h2 id="lab-title">Loading</h2>
            <p id="lab-description">Preparing the lab runtime.</p>
            <div class="panel-divider"></div>
            <div id="gui-root"></div>
          </aside>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
